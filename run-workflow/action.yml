name: "steamtrain run-workflow"
description: >-
  Run a steamtrain workflow headlessly in CI and publish a machine-readable
  report (JSON / Markdown / JUnit). The job fails with a stable, documented
  exit code that distinguishes a step failure, a gate rejection, a timeout, a
  cost-budget breach, and a cancel — so pipelines can branch on WHY a run
  failed without parsing logs.
author: "steamtrain"
branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  workflow:
    description: "Name of the workflow to run (from steamtrain.json or the bundled catalog)."
    required: true
  input:
    description: "The workflow input text ({{input}})."
    required: true
  params:
    description: >-
      Optional input params, one `key=value` per line. Each becomes a
      `--param key=value`.
    required: false
    default: ""
  config-file:
    description: "Path to a custom steamtrain.json (passed as --config-file)."
    required: false
    default: ""
  project-dir:
    description: "Operate on this project directory instead of the workspace (passed as --project-dir)."
    required: false
    default: ""
  report:
    description: "Report format to publish: json, markdown, or junit."
    required: false
    default: "junit"
  report-path:
    description: >-
      Where to write the report. Defaults to steamtrain-report.<ext> in the
      workspace, with <ext> chosen from the report format.
    required: false
    default: ""
  approve-all:
    description: >-
      Auto-approve every human checkpoint (unattended CI). Set to "false" to
      auto-reject and stop instead.
    required: false
    default: "true"
  agent:
    description: "Re-route steps whose pinned agent is not ready onto this agent (passed as --agent)."
    required: false
    default: ""
  fresh:
    description: "Ignore and delete the on-disk step cache for this run (passed as --fresh)."
    required: false
    default: "false"
  extra-args:
    description: "Extra raw arguments appended verbatim to `steamtrain workflow run`."
    required: false
    default: ""
  upload-artifact:
    description: "Upload the report as a workflow artifact named `steamtrain-report`."
    required: false
    default: "true"

outputs:
  exit-code:
    description: "The steamtrain process exit code (see the exit-code contract in the README)."
    value: ${{ steps.run.outputs.exit-code }}
  outcome:
    description: >-
      High-level outcome derived from the exit code: success, step-failed,
      gate-failed, timeout, budget-exceeded, or canceled.
    value: ${{ steps.run.outputs.outcome }}
  report-path:
    description: "Absolute path to the generated report file."
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Build steamtrain
      shell: bash
      run: |
        set -euo pipefail
        root="$(cd "${{ github.action_path }}/.." && pwd)"
        echo "Building steamtrain from ${root}"
        (cd "${root}" && bun install --frozen-lockfile && bun run build)
        echo "STEAMTRAIN_ROOT=${root}" >> "${GITHUB_ENV}"

    - name: Run workflow
      id: run
      shell: bash
      run: |
        # -e is intentionally omitted: we run steamtrain and then need to map
        # its non-zero exit code to the outcome output. With -e, the first
        # failing node invocation would terminate the step before the capture.
        set -uo pipefail
        root="${STEAMTRAIN_ROOT:-$(cd "${{ github.action_path }}/.." && pwd)}"

        format="${{ inputs.report }}"
        case "${format}" in
          json) ext="json" ;;
          markdown) ext="md" ;;
          junit) ext="xml" ;;
          *) echo "::error::invalid report format '${format}' (expected json, markdown, or junit)"; exit 1 ;;
        esac

        report_path="${{ inputs.report-path }}"
        if [ -z "${report_path}" ]; then
          report_path="${GITHUB_WORKSPACE}/steamtrain-report.${ext}"
        fi

        args=(workflow run "${{ inputs.workflow }}" --input "${{ inputs.input }}")
        args+=(--report "${format}" --output "${report_path}")

        if [ -n "${{ inputs.config-file }}" ]; then args+=(--config-file "${{ inputs.config-file }}"); fi
        if [ -n "${{ inputs.project-dir }}" ]; then args+=(--project-dir "${{ inputs.project-dir }}"); fi
        if [ -n "${{ inputs.agent }}" ]; then args+=(--agent "${{ inputs.agent }}"); fi
        if [ "${{ inputs.fresh }}" = "true" ]; then args+=(--fresh); fi
        if [ "${{ inputs.approve-all }}" = "true" ]; then args+=(--approve-all); fi

        # One `--param key=value` per non-empty input line.
        if [ -n "${{ inputs.params }}" ]; then
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            args+=(--param "${line}")
          done <<< "${{ inputs.params }}"
        fi

        if [ -n "${{ inputs.extra-args }}" ]; then
          # shellcheck disable=SC2206
          args+=(${{ inputs.extra-args }})
        fi

        echo "::group::steamtrain ${args[*]}"
        node "${root}/dist/index.js" "${args[@]}"
        code=$?
        echo "::endgroup::"

        case "${code}" in
          0) outcome="success" ;;
          1) outcome="step-failed" ;;
          2) outcome="gate-failed" ;;
          3) outcome="timeout" ;;
          4) outcome="budget-exceeded" ;;
          130) outcome="canceled" ;;
          *) outcome="error" ;;
        esac

        echo "exit-code=${code}" >> "${GITHUB_OUTPUT}"
        echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"
        echo "report-path=${report_path}" >> "${GITHUB_OUTPUT}"

        {
          echo "## steamtrain · ${{ inputs.workflow }}"
          echo ""
          echo "Outcome: **${outcome}** (exit code \`${code}\`)"
          echo ""
          echo "Report: \`${report_path}\` (artifact: \`steamtrain-report\`)"
        } >> "${GITHUB_STEP_SUMMARY}"

        exit "${code}"

    - name: Upload report artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: steamtrain-report
        path: ${{ steps.run.outputs.report-path }}
        if-no-files-found: warn
