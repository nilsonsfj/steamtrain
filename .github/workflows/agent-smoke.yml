name: Agent CLI smoke

# Nightly (and on-demand) live probe against a real agent CLI.
# The default PR CI suite stays agentless; this job is the Phase 3 signal that
# adapter stream-format / flag drift would otherwise ship green.
#
# Requires repository secret ANTHROPIC_API_KEY (Claude Code reads it). When the
# secret is absent the job is skipped rather than failed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Real agent CLI smoke
        env:
          STEAMTRAIN_AGENT_SMOKE: "1"
          STEAMTRAIN_SMOKE_AGENT: claude
          STEAMTRAIN_SMOKE_MODEL: haiku
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run test:agent-smoke
