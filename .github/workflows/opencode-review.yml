name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor != 'cursor[bot]'
    # Not ubuntu-slim: its jobs are hard-capped at 15 minutes, and a review of
    # a large PR with the free model runs past that and gets cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          VERSION: "1.18.32"
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Review this pull request for steamtrain, a TypeScript CLI/TUI/Web workflow orchestrator:
            - Check for code quality issues and consistency with existing patterns
            - Look for potential bugs, especially around workflow overrides, web server routes, and history retention
            - Verify tests cover meaningful behavior (not just trivial assertions)
            - Note if Bun-specific scripts (build-reducer, pretest) are affected
            - Suggest improvements when they add clear value

            Do not install dependencies or run lint, typecheck, tests or builds:
            the CI workflow already runs them on this PR, and they take minutes
            of the review's time budget. Review by reading the diff and code.
