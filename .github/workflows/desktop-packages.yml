name: Desktop packages

# Real installers, built on demand rather than on every push: each artifact is
# ~100 MB, nothing downstream consumes them automatically, and CI already
# proves on every PR that the app packages and launches (the `desktop` job in
# ci.yml, which stops at `--dir`).
#
# The results are unsigned. macOS will quarantine the dmg — docs/desktop-app.md
# says how to open it anyway.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No arch flag: the config asks for arm64 *and* x64, and an artifact
          # meant to be handed to someone should cover both Macs.
          - os: macos-latest
            target: --mac
            artifact: macos
          - os: ubuntu-slim
            target: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the engine and the shell
        run: |
          bun run build
          bun run build:electron

      - name: Package
        # Without this electron-builder signs with whatever identity happens to
        # be in the runner's keychain, which is not something a build should
        # decide for itself.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bunx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: steamtrain-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
