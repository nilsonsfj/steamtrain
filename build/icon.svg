<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The steamtrain app icon.

    The locomotive is not redrawn for this size — it is the 32-unit geometry of
    `FAVICON_SVG` (src/web/html.ts) and the steamtrain.app masthead, reproduced
    coordinate for coordinate inside the <g> and placed by the transform alone.
    An earlier version of this file drew a more detailed engine for 1024 (a
    chimney, a rail under the wheels) on the theory that a silhouette wastes the
    pixels a dock icon gets. It does waste them, but the cost was two drawings
    that drifted: the dock and the browser tab stopped being the same mark. One
    geometry, scaled, is worth more than two tuned ones.

    What is tuned here is only the plate the mark sits on — the gradient, the
    inner glow and the top rim, all of which are invisible at 32px and all of
    which are what makes a macOS icon look seated rather than pasted on.

    `scripts/build-icon.ts` rasterises this to build/icon.png, which is what
    electron-builder converts into .icns, .ico and the Linux size ladder.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202a"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".58">
      <stop offset="0" stop-color="#34d3c4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#34d3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 224 is the macOS squircle radius at this size, and 7/32 of the favicon's. -->
  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="219" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <!--
    scale(28) leaves the mark 896 wide inside 1024, so nothing reaches the
    squircle's corner arcs. x=64 centres it as drawn; y=72 centres the drawn
    extent (0.1 to 31.3 in 32-space) rather than the viewBox, which the puffs
    and the wheels make asymmetric.
  -->
  <g transform="translate(64 72) scale(28)">
    <!-- Steam, drifting back off the top-right corner. -->
    <circle cx="14.5" cy="6.5" r="1.4" fill="#34d3c4" opacity=".35"/>
    <circle cx="19" cy="4.4" r="1.9" fill="#34d3c4" opacity=".6"/>
    <circle cx="25" cy="2.6" r="2.5" fill="#34d3c4" opacity=".9"/>

    <!-- Cab, then the boiler running the full width beneath it. -->
    <rect x="6" y="8" width="5.5" height="7" rx="1.6" fill="#34d3c4"/>
    <rect x="3" y="14" width="26" height="11" rx="3.2" fill="#34d3c4"/>

    <!-- Driving wheels: the plate colour showing through an accent ring. -->
    <circle cx="10" cy="27.5" r="3" fill="#0c0e11" stroke="#34d3c4" stroke-width="1.6"/>
    <circle cx="22" cy="27.5" r="3" fill="#0c0e11" stroke="#34d3c4" stroke-width="1.6"/>
  </g>
</svg>
