<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The steamtrain app icon.

    The same locomotive as the web UI's favicon (`FAVICON_SVG` in
    src/web/html.ts) and the same palette, but drawn for this size rather than
    scaled up from it. The favicon's geometry is tuned for 32px, where a
    silhouette is all that survives; at 1024 the details it leaves out — a
    chimney for the steam to come out of, a rail under the wheels rather than
    through them — are the first things the eye looks for.

    `scripts/build-icon.ts` rasterises this to build/icon.png, which is what
    electron-builder converts into .icns, .ico and the Linux size ladder.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202a"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".58">
      <stop offset="0" stop-color="#34d3c4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#34d3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 224 is the macOS squircle radius at this size, and 7/32 of the favicon's. -->
  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="219" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <g transform="translate(0 16)">
    <!-- Steam, leaving the chimney and drifting back over the cab. -->
    <circle cx="724" cy="300" r="44" fill="#8eeae0" opacity=".85"/>
    <circle cx="800" cy="238" r="32" fill="#8eeae0" opacity=".6"/>
    <circle cx="858" cy="192" r="21" fill="#8eeae0" opacity=".38"/>

    <!-- Chimney: flared cap over a stack, seated on the boiler. -->
    <rect x="676" y="356" width="96" height="38" rx="15" fill="#1c6f68"/>
    <rect x="692" y="382" width="64" height="104" rx="12" fill="#1c6f68"/>

    <!-- Cab, with the roof overhanging on both sides. -->
    <rect x="182" y="336" width="268" height="36" rx="18" fill="#1c6f68"/>
    <rect x="202" y="360" width="228" height="292" rx="26" fill="#1c6f68"/>
    <rect x="238" y="398" width="156" height="116" rx="20" fill="#0e1116" opacity=".55"/>

    <!-- Boiler, and the smokebox band closing off its front. -->
    <rect x="380" y="470" width="432" height="182" rx="40" fill="#34d3c4"/>
    <rect x="762" y="474" width="46" height="174" rx="20" fill="#1c6f68" opacity=".55"/>

    <!-- Footplate the whole locomotive sits on. -->
    <rect x="196" y="638" width="628" height="58" rx="18" fill="#1c6f68"/>

    <!-- Driving wheels, resting on the rail rather than crossing it. -->
    <circle cx="360" cy="730" r="78" fill="#0e1116" stroke="#34d3c4" stroke-width="30"/>
    <circle cx="360" cy="730" r="26" fill="#34d3c4"/>
    <circle cx="664" cy="730" r="78" fill="#0e1116" stroke="#34d3c4" stroke-width="30"/>
    <circle cx="664" cy="730" r="26" fill="#34d3c4"/>

    <!-- The one warm note in the palette, as in the favicon. -->
    <path d="M150 826h724" stroke="#d29922" stroke-width="20" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
